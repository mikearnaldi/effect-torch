[package]
name = "effect-torch-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candle-core = { git = "https://github.com/mikearnaldi/candle", rev = "d848572a49a24ef19118c6170f1bd6a2407bb389", features = ["ug"] }
napi = { version = "3", features = ["async"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
ug = "0.5.0"
libm = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { git = "https://github.com/mikearnaldi/candle", rev = "d848572a49a24ef19118c6170f1bd6a2407bb389", features = ["metal", "accelerate", "ug"] }
candle-metal-kernels = { git = "https://github.com/mikearnaldi/candle", rev = "d848572a49a24ef19118c6170f1bd6a2407bb389" }
objc2 = "0.6"
objc2-metal = "0.3.2"

[build-dependencies]
napi-build = "1"

[features]
default = []
cuda = ["candle-core/cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
mkl = ["candle-core/mkl"]
nccl = ["cuda", "candle-core/nccl"]

[profile.release]
lto = true
codegen-units = 1
