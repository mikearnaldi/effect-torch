[package]
name = "effect-torch-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candle-core = "0.9"
napi = { version = "3", features = ["async"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["metal", "accelerate"] }

[build-dependencies]
napi-build = "1"

[features]
default = []
cuda = ["candle-core/cuda"]
cudnn = ["cuda", "candle-core/cudnn"]
mkl = ["candle-core/mkl"]
nccl = ["cuda", "candle-core/nccl"]

[profile.release]
lto = true
codegen-units = 1
