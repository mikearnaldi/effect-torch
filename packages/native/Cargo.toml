[package]
name = "effect-torch-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
libm = "0.2"
half = "2"
matrixmultiply = "0.3"
tokenizers = "0.22"
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3.2"
objc2-foundation = "0.3"

[build-dependencies]
napi-build = "1"

[lints.rust]
# CUDA is phase 4 (RFC 0015): cfg hooks stay in place until then.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cuda"))'] }

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
