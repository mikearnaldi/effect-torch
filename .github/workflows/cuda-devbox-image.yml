name: CUDA devbox image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cuda-devbox-image.yml"
      - ".dockerignore"
      - "Dockerfile.cuda-devbox"
      - "flake.nix"
      - "flake.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".opencode/package.json"
      - "crates/**/Cargo.toml"
      - "packages/**/Cargo.toml"
      - "packages/**/package.json"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cuda-devbox
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:cuda-devbox
            ghcr.io/${{ github.repository }}:cuda-devbox-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cuda-devbox
          cache-to: type=gha,mode=max,scope=cuda-devbox
